# Instaladores do Loftchat (etapa 9c/9d; Android desde 17/11/2026).
#
# - "Run workflow" (à mão, na aba Actions): monta os três e deixa para baixar
#   em "Artifacts", sem publicar nada.
# - Etiqueta de versão (v0.2.0, v0.2.5…): monta e PUBLICA nas Releases — é de
#   lá que o site baixa e que o programa e o app Android se atualizam sozinhos.
#   A versão da etiqueta tem que ser a do desktop/package.json e ter as
#   novidades escritas no novidades.json (o primeiro passo confere).
#
# O Windows é montado num Windows de verdade: no Linux, o instalador NSIS
# exige o Wine para gerar o desinstalador.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão da etiqueta = versão do Loftchat, com novidades escritas
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao=$(node -p "require('./desktop/package.json').version")
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "A etiqueta é $GITHUB_REF_NAME, mas o desktop/package.json diz $versao."; exit 1
          fi
          node scripts/notas-da-versao.mjs "$versao" > /dev/null

  windows:
    needs: conferir
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Chat embutido
        run: npm run build:desktop
        env:
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - run: npm ci
        working-directory: desktop
      - name: Instalador do Windows
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Loftchat-Setup.exe
            desktop/dist/latest.yml

  linux:
    # Depois do Windows: os dois publicam na MESMA versão, um de cada vez.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Chat embutido
        run: npm run build:desktop
        env:
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - run: npm ci
        working-directory: desktop
      - name: Instalador do Linux
        working-directory: desktop
        run: npx electron-builder --linux --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/Loftchat.AppImage
            desktop/dist/latest-linux.yml

  android:
    needs: conferir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Chat dentro do app
        run: |
          npx vite build --logLevel error
          npx cap sync android
        env:
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - name: Chave de assinatura (segredo LOFT_CHAVE_BASE64)
        env:
          LOFT_CHAVE_BASE64: ${{ secrets.LOFT_CHAVE_BASE64 }}
        run: |
          if [ -n "$LOFT_CHAVE_BASE64" ]; then
            echo "$LOFT_CHAVE_BASE64" | base64 -d > "$RUNNER_TEMP/loftchat.jks"
            echo "LOFT_CHAVE=$RUNNER_TEMP/loftchat.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            echo "Falta o segredo LOFT_CHAVE_BASE64: sem ele o APK não atualiza por cima."; exit 1
          fi
      - name: APK do Android
        working-directory: android
        env:
          LOFT_CHAVE_SENHA: ${{ secrets.LOFT_CHAVE_SENHA }}
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease
          mv app/build/outputs/apk/release/app-release*.apk ../Loftchat-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Loftchat-Android.apk

  publicar:
    # O APK do Android e o texto das novidades entram na versão que o
    # Windows e o Linux já publicaram.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: APK e novidades na Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/notas-da-versao.mjs "$GITHUB_REF_NAME" > notas.md
          gh release upload "$GITHUB_REF_NAME" Loftchat-Android.apk --clobber
          gh release edit "$GITHUB_REF_NAME" --title "Loftchat ${GITHUB_REF_NAME#v}" --notes-file notas.md
