<!doctype html>
<!--
  TEMA — o atributo data-theme abaixo controla a paleta:
    ausente          → segue o tema do sistema operacional (prefers-color-scheme)
    data-theme="dark"  → força escuro
    data-theme="light" → força claro
  Para inspecionar o outro tema sem mexer no Windows, edite o atributo aqui
  ou pelo DevTools (Elements → nó <html>).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` é para telas com entalhe (permite usar env(safe-area-inset-*)).
      NÃO é o que conserta o celular: a meta tag já estava aqui desde a etapa 1, e o
      problema era outro — as colunas fixas somam 564px e o `overflow: hidden` do
      reset.css cortava tudo sem deixar alcançar o resto. Ver reset.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loft</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5B5BD6" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- favicon inline: evita a requisicao de /favicon.ico -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 10 12 4l8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9Z' fill='%235B5BD6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
