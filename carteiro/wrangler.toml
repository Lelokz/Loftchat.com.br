# O CARTEIRO das notificações (versão 0.4.0). Roda na Cloudflare (grátis).
# Publicar: cd carteiro && npm run publicar   (ver LEIA.md)
name = "loftchat-carteiro"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
PROJETO = "loft-3d6c0f"
# 0.12.0: as insígnias especiais, dadas à mão (por @ ou uid). Ver src/insignias.ts.
# Ids: criador, testador, bug, lancamento.
ESPECIAIS = '{"criador":[],"testador":[],"bug":[],"lancamento":[]}'

[observability]
enabled = true

# Arquivos (0.5.0): imagem, GIF, vídeo e figurinha. Ver src/arquivos.ts.
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "loftchat-arquivos"

# A limpeza de todo dia (03:17 em Brasília).
[triggers]
crons = ["17 6 * * *"]

# 0.10.5: transcrição das mensagens de voz (Whisper large-v3-turbo, grátis até
# 10.000 neurons por dia; passou disso dá erro, não cobra).
[ai]
binding = "AI"
